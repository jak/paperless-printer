# paperless-ngx with a network printer that drops every printed document straight into
# paperless's consume directory. Print from any phone or laptop and it gets OCR'd.
#
#   echo 'choose-a-password' > ../../admin_password.txt
#   docker compose up -d
#
# The printer writes PDFs as PUID:PGID, and paperless runs as USERMAP_UID:USERMAP_GID.
# Keep them the same so paperless can read the files and delete them after consuming.
services:
  printer:
    image: ghcr.io/jak/virtual-cups-printer:2
    restart: unless-stopped
    network_mode: host
    environment:
      PRINTER_NAME: Paperless
      PUID: 1000
      PGID: 1000
      CUPS_ADMIN_PASSWORD_FILE: /run/secrets/cups_admin_password
    secrets:
      - cups_admin_password
    volumes:
      - ./consume:/mnt/output
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_BIND_SERVICE, SYS_CHROOT]
    security_opt:
      - no-new-privileges:true

  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on: [broker]
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      # Printed PDFs often already contain a text layer from the print driver, which can be
      # poor. Forcing OCR gives consistent search results.
      PAPERLESS_OCR_MODE: force
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume

volumes:
  data:
  media:
  redisdata:

secrets:
  cups_admin_password:
    file: ../../admin_password.txt
