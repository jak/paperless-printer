# Paperless Printer: print to PDF from any device. A network printer that saves every job as a PDF.
#
#   1. echo 'choose-a-password' > admin_password.txt
#   2. docker compose up -d
#   3. Print to "Paperless Printer" from any device on the LAN. PDFs land in ./output.
#
# Host networking is the simplest way for AirPrint/Bonjour discovery to work. For several
# printers on one host, or a dedicated IP, see examples/macvlan. To feed paperless-ngx,
# see examples/paperless.
services:
  printer:
    image: ghcr.io/jak/paperless-printer:2
    # build: .            # build from source instead of pulling
    restart: unless-stopped
    network_mode: host    # needed for mDNS discovery; the web UI is on https://<host>:631
    environment:
      PRINTER_NAME: Paperless Printer
      PRINTER_LOCATION: Office
      PAPER_SIZE: A4                  # or Letter
      TZ: Europe/London
      PUID: 1000                      # owner of the PDFs (match the consumer, e.g. paperless)
      PGID: 1000
      UMASK: "0022"                   # 0644 files
      # Only accept connections from the local network(s). Printing is anonymous, so without
      # this anyone who can reach port 631 could drop documents into the output folder.
      CUPS_ALLOW_FROM: "@LOCAL"
      CUPS_ADMIN_PASSWORD_FILE: /run/secrets/cups_admin_password
    secrets:
      - cups_admin_password
    volumes:
      - ./output:/mnt/output
      - spool:/var/spool
    # Least privilege: only the capabilities CUPS, cups-pdf and Avahi need.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_BIND_SERVICE, SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; scratch state lives in tmpfs. /var/spool is a volume so PDFs
    # still waiting to be written to the output (e.g. while it is full) and job numbers
    # survive restarts.
    read_only: true
    tmpfs: [/run, /tmp]

volumes:
  spool:

secrets:
  cups_admin_password:
    file: ./admin_password.txt
