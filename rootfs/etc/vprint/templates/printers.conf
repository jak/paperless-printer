# Rendered by vprint-entrypoint at container start from environment variables.
# cupsd rewrites this file while running; changes made in the web UI are not persistent.
<DefaultPrinter ${PRINTER_ID}>
UUID urn:uuid:${PRINTER_UUID}
Info ${PRINTER_NAME}
Location ${PRINTER_LOCATION}
MakeModel CUPS-PDF
DeviceURI cups-pdf:/
State Idle
StateTime ${VPRINT_NOW}
ConfigTime ${VPRINT_NOW}
Accepting Yes
Shared Yes
JobSheets none none
QuotaPeriod 0
PageLimit 0
KLimit 0
OpPolicy default
ErrorPolicy retry-job
# Defaults for jobs that don't say (e.g. lp, Windows, some Android apps). The PPD has no
# ColorModel option, so cupsd would otherwise default to monochrome and PDFs came out grey.
# auto-fit shrinks pages larger than the paper (a 16:9 slide on A4) instead of cropping them,
# and leaves pages that fit untouched (an A5 page is not enlarged).
Option print-color-mode color
Option print-scaling auto-fit
</DefaultPrinter>
