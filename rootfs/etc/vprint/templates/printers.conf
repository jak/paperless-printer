# Rendered by vprint-entrypoint at container start from environment variables.
# cupsd rewrites this file while running; changes made in the web UI are not persistent.
<DefaultPrinter ${PRINTER_ID}>
UUID urn:uuid:${PRINTER_UUID}
Info ${PRINTER_NAME}
Location ${PRINTER_LOCATION}
MakeModel CUPS-PDF
DeviceURI cups-pdf:/
State Idle
StateTime ${VPRINT_NOW}
ConfigTime ${VPRINT_NOW}
Accepting Yes
Shared Yes
JobSheets none none
QuotaPeriod 0
PageLimit 0
KLimit 0
OpPolicy default
ErrorPolicy retry-job
</DefaultPrinter>
