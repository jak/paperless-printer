# Rendered by vprint-entrypoint at container start.
#
# cups-pdf writes the PDF in place while Ghostscript is still running, so it writes into a
# private staging directory. vprint-postprocess marks each finished file, and vprint-mover
# then installs it into OUTPUT_DIR under a temporary name and renames it, so consumers
# such as paperless-ngx never see a half-written file.

Out ${VPRINT_STAGING_DIR}
AnonDirName ${VPRINT_STAGING_DIR}
AnonUser vprint
# Always label with the job id: vprint-mover uses it to look up the job's real title
# (cups-pdf 3.0.2 garbles titles it reads from the PostScript) and applies OUTPUT_LABEL itself.
Label 2

# Files are re-owned and chmod'ed by vprint-mover; keep staging copies private.
AnonUMask 0077
UserUMask 0077

Grp lpadmin
DecodeHexStrings 0

# Errors and status lines go to the container log (the log file is a symlink to stderr).
Log /run/vprint/log
LogType 3

PostProcessing /usr/local/bin/vprint-postprocess

# Wrapper that reports failed conversions (cups-pdf itself ignores them).
GhostScript /usr/local/bin/vprint-gs

# Ghostscript scratch space (default /var/tmp would need another writable mount).
GSTmp /tmp
