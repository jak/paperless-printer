# Rendered by vprint-entrypoint at container start. Edit the template, not /etc/cups/cupsd.conf.
LogLevel ${CUPS_LOG_LEVEL}
PageLogFormat

# IPv4 + IPv6 on 631, plus the local socket used by lpstat/healthcheck.
Port 631
Listen /run/cups/cups.sock

# CUPS rejects any Host header it does not recognise, including the container's own
# IP, so LAN clients need a wildcard (or an explicit list of names/IPs).
ServerAlias ${CUPS_SERVER_ALIAS}

# Discovery is published by Avahi from /etc/avahi/services/vprint.service, not by cupsd
# (cupsd's DNS-SD needs D-Bus, which this container does not run).
Browsing Off

DefaultAuthType Basic
# Clients may upgrade to TLS (self-signed cert is generated automatically);
# /admin below requires it so the admin password never crosses the network in clear text.
DefaultEncryption IfRequested
WebInterface ${CUPS_WEB_INTERFACE}

<Location />
  Order allow,deny
${CUPS_ALLOW_DIRECTIVES}
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Encryption Required
  Order allow,deny
${CUPS_ALLOW_DIRECTIVES}
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Encryption Required
  Order allow,deny
${CUPS_ALLOW_DIRECTIVES}
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Encryption Required
  Order allow,deny
${CUPS_ALLOW_DIRECTIVES}
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Printing is anonymous: phones and laptops on the LAN print without credentials.
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Administration requires an lpadmin user over an encrypted connection.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Encryption Required
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Encryption Required
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
