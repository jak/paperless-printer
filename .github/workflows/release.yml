name: Release

# Build the multi-arch image once, push it as a candidate, test *that* image (lint, smoke test
# on native amd64 + arm64 with default and hardened settings, Trivy), then promote the same
# digest to the version tags. Nothing is published under a version tag unless it passed.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    # Weekly security rebuild of the newest release, so Debian security updates reach users
    # without a code change. The version tags are republished (they are mutable; pin by
    # digest if you need immutability).
    - cron: "41 6 * * 2"
  workflow_dispatch: # rebuilds the newest release, like the schedule

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  HARDENED_ARGS: >-
    --cap-drop ALL
    --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID
    --cap-add SETGID --cap-add KILL --cap-add NET_BIND_SERVICE --cap-add SYS_CHROOT
    --security-opt no-new-privileges:true
    --read-only --tmpfs /run --tmpfs /tmp --tmpfs /var/spool

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      tags: ${{ steps.tag.outputs.tags }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        run: |
          set -euo pipefail
          stable=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(tail -n1 <<<"$stable")
          fi
          if [[ -z $tag ]]; then
            echo "No release tag yet; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $tag =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$tag' is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} pre=${BASH_REMATCH[4]}
          version=${tag#v}
          tags="$IMAGE:$version"
          if [[ -z $pre ]]; then
            # Floating tags only move forward: a backport (e.g. v1.9.1 after v2.0.0) must not
            # take over "latest" or an older line's newer patch.
            newest_in() { grep -E "^v$1" <<<"$stable" | tail -n1; }
            [[ $(newest_in "${major}\.${minor}\.") == "$tag" ]] && tags+=",$IMAGE:$major.$minor"
            [[ $(newest_in "${major}\.") == "$tag" ]] && tags+=",$IMAGE:$major"
            [[ $(tail -n1 <<<"$stable") == "$tag" ]] && tags+=",$IMAGE:latest"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "tags=$tags"
            echo "prerelease=$([[ -n $pre ]] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          echo "Releasing $tag as: $tags" | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - run: test/lint.sh

  build-candidate:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=candidate-${{ github.run_id }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: ref
        run: echo "image=$IMAGE@${{ steps.build.outputs.digest }}" >>"$GITHUB_OUTPUT"

  verify:
    needs: [resolve, build-candidate]
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "${{ needs.build-candidate.outputs.image }}"
      - name: Smoke test (default settings)
        run: IMAGE="${{ needs.build-candidate.outputs.image }}" test/smoke.sh
      - name: Smoke test (hardened + read-only)
        run: IMAGE="${{ needs.build-candidate.outputs.image }}" SERVER_ARGS="$HARDENED_ARGS" test/smoke.sh

  scan:
    needs: [resolve, build-candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build-candidate.outputs.image }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  promote:
    needs: [resolve, build-candidate, lint, verify, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point the version tags at the tested digest
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
          SOURCE: ${{ needs.build-candidate.outputs.image }}
        run: |
          set -euo pipefail
          args=()
          IFS=, read -r -a list <<<"$TAGS"
          for t in "${list[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          echo "Published $SOURCE as: $TAGS" | tee -a "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [resolve, promote]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes)
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" \
            --notes "Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64). See [CHANGELOG.md](CHANGELOG.md) for upgrade notes."
