name: CI

on:
  push:
    branches: [master] # other branches are covered by their pull request
  pull_request:
  schedule:
    # Weekly: catch base-image / Debian archive rot before users do.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HARDENED_ARGS: >-
    --cap-drop ALL
    --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID
    --cap-add SETGID --cap-add KILL --cap-add NET_BIND_SERVICE --cap-add SYS_CHROOT
    --security-opt no-new-privileges:true
    --read-only --tmpfs /run --tmpfs /tmp --tmpfs /var/spool

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/lint.sh

  build-test:
    name: build + smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vprint:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          # A scheduled run must re-fetch packages, not reuse a cached apt layer.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test (default capabilities)
        run: IMAGE=vprint:ci test/smoke.sh
      - name: Smoke test (hardened + read-only, as in the compose examples)
        run: IMAGE=vprint:ci SERVER_ARGS="$HARDENED_ARGS" test/smoke.sh
      - name: Image size
        run: docker image ls vprint:ci --format 'vprint:ci ${{ matrix.arch }} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save image for scanning
        if: matrix.arch == 'amd64'
        run: docker save vprint:ci -o /tmp/vprint.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'amd64'
        with:
          name: image-amd64
          path: /tmp/vprint.tar
          retention-days: 1

  scan:
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: /tmp
      - name: Trivy (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/vprint.tar
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      # The token can't write security events on Dependabot or fork PRs; the table gate
      # below still runs there.
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: >-
          always() && hashFiles('trivy.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'))
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/vprint.tar
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
